name: build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.5

      - name: install libraries thing
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.3.3
          haxelib install hscript 2.4.0
          haxelib install newgrounds
          haxelib install actuate
          haxelib install hxcpp
          haxelib install format
          haxelib install hxp
          haxelib git extension-webm https://github.com/GrowtopiaFli/extension-webm
          haxelib install polymod 1.3.1
          haxelib run lime setup -alias -y

      - name: compiling
        run: haxelib run lime build mac -debug

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: export/debug/macos/bin
